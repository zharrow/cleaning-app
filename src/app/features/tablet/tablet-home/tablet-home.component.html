<div class="tablet-container">
  <!-- Header -->
  <div class="tablet-header">
    <div class="tablet-header-content">
      @if (currentUser(); as user) {
        <div>
          <h1 class="tablet-title">Bonjour {{ user.first_name }} !</h1>
          <p class="tablet-subtitle">Sélectionnez une salle pour commencer</p>
        </div>
      }
      <button class="btn btn-outline btn-lg" (click)="logout()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Déconnexion
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="tablet-content">
    @if (hasRooms()) {
      <!-- Rooms Grid -->
      <div class="rooms-grid">
        @for (roomId of accessibleRooms(); track roomId) {
          <button
            class="room-card"
            (click)="goToRoom(roomId)">
            <div class="room-icon">
              <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
            </div>
            <div class="room-name">Salle {{ roomId }}</div>
            <div class="room-arrow">→</div>
          </button>
        }
      </div>
    } @else {
      <!-- Empty State -->
      <div class="tablet-empty">
        <svg class="w-24 h-24 text-muted mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
        <h2 class="text-2xl font-bold mb-2">Aucune salle accessible</h2>
        <p class="text-muted">Contactez votre administrateur pour obtenir des accès</p>
      </div>
    }
  </div>
</div>
