<div class="tablet-room-container">
  <!-- Header -->
  <div class="tablet-room-header">
    <button class="btn-back" (click)="goBack()">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Retour
    </button>
    <h1 class="room-title">{{ roomName() }}</h1>
    <div class="room-status">
      <span class="status-badge">En cours</span>
    </div>
  </div>

  <!-- Content -->
  <div class="tablet-room-content">
    <!-- Placeholder for tasks -->
    <div class="coming-soon">
      <svg class="w-24 h-24 text-primary-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
      </svg>
      <h2 class="text-2xl font-bold text-white mb-2">Tâches de nettoyage</h2>
      <p class="text-primary-200">L'interface des tâches sera bientôt disponible</p>
    </div>
  </div>
</div>
