name: 🚀 cLean Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  # =======================================
  # 🔍 TESTS & QUALITY CHECKS
  # =======================================

  test-and-lint:
    name: 🧪 Test & Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 🗂️ Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 ESLint check
        run: |
          echo "🔍 Running ESLint..."
          pnpm run lint

      - name: 🎯 TypeScript type check
        run: |
          echo "🎯 Running TypeScript type check..."
          pnpm run type-check

      - name: 🎨 Prettier format check
        run: |
          echo "🎨 Checking code formatting..."
          pnpm run format:check

      - name: 🧪 Run unit tests
        run: |
          echo "🧪 Running unit tests..."
          pnpm run test:ci

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  # =======================================
  # 🏗️ BUILD & ANALYZE
  # =======================================

  build-and-analyze:
    name: 🏗️ Build & Analyze
    runs-on: ubuntu-latest
    needs: [test-and-lint]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build production
        run: |
          echo "🏗️ Building for production..."
          pnpm run build:prod
        env:
          # Default environment variables for build
          NG_APP_API_URL: https://api.example.com
          NG_APP_FIREBASE_API_KEY: build-key
          NG_APP_FIREBASE_PROJECT_ID: build-project

      - name: 📊 Bundle analyzer
        run: |
          echo "📊 Analyzing bundle size..."
          pnpm run build:analyze || echo "Bundle analyzer not available"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

      - name: 📋 Build report
        run: |
          echo "📋 Build Summary:"
          echo "✅ Build completed successfully"
          ls -la dist/
          du -sh dist/

  # =======================================
  # 🔒 SECURITY & AUDIT
  # =======================================

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🔍 npm audit
        run: |
          echo "🔍 Running npm security audit..."
          pnpm audit --audit-level moderate || echo "⚠️ Some vulnerabilities found, check report"

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =======================================
  # 🚀 DEPLOYMENT TO VERCEL
  # =======================================

  deploy:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build-and-analyze, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build for production
        run: pnpm run build:prod
        env:
          NG_APP_API_URL: ${{ secrets.BACKEND_URL }}
          NG_APP_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NG_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NG_APP_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NG_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NG_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NG_APP_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  # =======================================
  # 🧪 POST-DEPLOYMENT TESTS
  # =======================================

  post-deployment-tests:
    name: 🧪 Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⏳ Wait for deployment
        run: |
          echo "⏳ Waiting for deployment to be available..."
          sleep 60

      - name: 🏥 Health check
        run: |
          echo "🏥 Running health check..."
          max_attempts=10
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts..."

            if curl -f --max-time 10 ${{ secrets.FRONTEND_URL }}; then
              echo "✅ Frontend health check passed!"
              break
            fi

            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Frontend health check failed after $max_attempts attempts"
              exit 1
            fi

            echo "❌ Health check failed, retrying in 30s..."
            sleep 30
            attempt=$((attempt + 1))
          done

      - name: 🧪 Basic functionality tests
        run: |
          echo "🧪 Running basic functionality tests..."

          # Test main page
          echo "Testing main page..."
          curl -f -s ${{ secrets.FRONTEND_URL }} | grep -q "cLean" && echo "✅ Main page loads correctly"

          # Test service worker
          echo "Testing service worker..."
          curl -f -s ${{ secrets.FRONTEND_URL }}/service-worker.js > /dev/null && echo "✅ Service worker available"

          # Test manifest
          echo "Testing PWA manifest..."
          curl -f -s ${{ secrets.FRONTEND_URL }}/manifest.json > /dev/null && echo "✅ PWA manifest available"

          echo "✅ All basic functionality tests passed!"

      - name: 🚀 PWA audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ secrets.FRONTEND_URL }}
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # =======================================
  # 📊 NOTIFICATIONS
  # =======================================

  notify:
    name: 📢 Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [post-deployment-tests]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: 🎉 Deployment Success
        if: needs.post-deployment-tests.result == 'success'
        run: |
          echo "🎉 cLean Frontend deployed successfully!"
          echo "🔗 App URL: ${{ secrets.FRONTEND_URL }}"
          echo "🧪 All tests passed!"
          echo "📱 PWA ready for installation"

      - name: 🚨 Deployment Failed
        if: needs.post-deployment-tests.result == 'failure'
        run: |
          echo "❌ cLean Frontend deployment failed!"
          echo "🔍 Check the deployment logs in Vercel dashboard"
          exit 1

  # =======================================
  # 📈 PERFORMANCE MONITORING (OPTIONAL)
  # =======================================

  performance-monitoring:
    name: 📈 Performance Monitoring
    runs-on: ubuntu-latest
    needs: [post-deployment-tests]
    if: github.ref == 'refs/heads/main' && needs.post-deployment-tests.result == 'success'

    steps:
      - name: 📈 Performance check
        run: |
          echo "📈 Running performance monitoring..."
          # Add performance monitoring logic here
          # Example: WebPageTest, GTMetrix API calls, etc.
          echo "✅ Performance monitoring completed"